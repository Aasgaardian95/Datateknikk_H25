[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = adafruit/Adafruit BME280 Library@^2.3.0
        https://github.com/adafruit/ENS160_driver
        https://github.com/sparkfun/SparkFun_TMP102_Arduino_Library
        https://github.com/hibit-dev/buzzer
